[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missionwise-backend"
version = "0.1.0"
description = "MISSIONWISE AI Space Mission Engineering Intelligence Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pgvector>=0.3.5,<1.0.0",
    "pymupdf>=1.24.9,<2.0.0",
    "pytesseract>=0.3.13,<1.0.0",
    "pillow>=10.4.0,<12.0.0",
    "sentence-transformers>=3.1.0,<5.0.0",
    "rank-bm25>=0.2.2,<1.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "httpx>=0.27.2,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "numpy>=1.26.4,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.6.9,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
